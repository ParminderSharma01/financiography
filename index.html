<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Financial Planner</title>
    <style>
        /* Rich Animated Background */
        body {
            margin: 0; padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1f005c, #5b0060, #870160, #ac255e, #ca485c, #e16b5c, #f39060, #ffb56b);
            background-size: 300% 300%;
            animation: gradientMove 12s ease infinite;
            color: #fff; display: flex; justify-content: center; align-items: center;
            height: 100vh; overflow: hidden;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Frosted Glass Container */
        .glass-panel {
            background: rgba(255, 255, 255, 0.1); backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px; padding: 40px; width: 90%; max-width: 550px;
            max-height: 85vh; overflow-y: auto; box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
            position: relative;
        }

        /* Custom Scrollbar */
        .glass-panel::-webkit-scrollbar { width: 8px; }
        .glass-panel::-webkit-scrollbar-track { background: rgba(255, 255, 255, 0.05); border-radius: 10px; }
        .glass-panel::-webkit-scrollbar-thumb { background: rgba(255, 255, 255, 0.3); border-radius: 10px; }

        /* Step Animations */
        .step { display: none; text-align: center; animation: slideIn 0.5s ease forwards; }
        .step.active { display: block; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(50px); }
            to { opacity: 1; transform: translateX(0); }
        }

        /* Typography & Inputs */
        h2 { font-size: 28px; margin-bottom: 30px; font-weight: 600; text-shadow: 0 2px 4px rgba(0,0,0,0.3); }
        h3 { margin-top: 0; color: #fff; }
        h4 { color: #ffe4a0; margin-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.2); padding-bottom: 5px; margin-top: 25px;}
        
        input {
            width: 100%; padding: 15px; background: rgba(255, 255, 255, 0.15);
            border: 2px solid rgba(255, 255, 255, 0.3); border-radius: 10px;
            color: #fff; font-size: 20px; text-align: center; box-sizing: border-box;
            outline: none; transition: 0.3s;
        }
        input::placeholder { color: rgba(255, 255, 255, 0.6); }
        input:focus { border-color: #fff; background: rgba(255, 255, 255, 0.25); }

        /* Premium Buttons */
        .btn-group { display: flex; gap: 15px; margin-top: 30px; }
        button {
            flex: 1; padding: 15px; border: none; border-radius: 10px;
            font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.3s;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }
        .btn-next { background: #fff; color: #5b0060; }
        .btn-next:hover { background: #f0f0f0; transform: translateY(-2px); }
        .btn-back { background: rgba(255, 255, 255, 0.2); color: #fff; border: 1px solid rgba(255, 255, 255, 0.3); }
        .btn-back:hover { background: rgba(255, 255, 255, 0.3); }

        /* Results Styling */
        #resultsContent { text-align: left; }
        .result-box {
            background: rgba(0, 0, 0, 0.2); padding: 25px; border-radius: 12px;
            margin-top: 15px; border-left: 5px solid #4ade80; font-size: 15px;
        }
        .result-box.warning { border-left-color: #fbbf24; }
        .result-box ul { padding-left: 20px; line-height: 1.8; margin-top: 0; }
        
        .quote-box {
            background: rgba(255, 255, 255, 0.1); padding: 15px; border-radius: 8px;
            font-style: italic; text-align: center; margin-bottom: 20px;
            border: 1px solid rgba(255,255,255,0.2);
        }

        .zero-based-summary {
            background: rgba(255, 255, 255, 0.15); padding: 12px; border-radius: 8px;
            text-align: center; font-weight: bold; margin-bottom: 20px; margin-top: 15px;
            border: 1px dashed rgba(255,255,255,0.4);
        }
    </style>
</head>
<body>

<div class="glass-panel">
    
    <!-- Steps 1 to 5 -->
    <div class="step active" id="step0">
        <h2>What is your monthly income?</h2>
        <input type="number" id="income" placeholder="0.00">
        <div class="btn-group"><button class="btn-next" onclick="nextStep(0)">Next</button></div>
    </div>

    <div class="step" id="step1">
        <h2>What are your fixed monthly expenses?</h2>
        <input type="number" id="expenses" placeholder="0.00">
        <div class="btn-group">
            <button class="btn-back" onclick="prevStep(1)">Back</button>
            <button class="btn-next" onclick="nextStep(1)">Next</button>
        </div>
    </div>

    <div class="step" id="step2">
        <h2>What are you saving for?</h2>
        <input type="text" id="goalName" placeholder="e.g., A new house">
        <div class="btn-group">
            <button class="btn-back" onclick="prevStep(2)">Back</button>
            <button class="btn-next" onclick="nextStep(2)">Next</button>
        </div>
    </div>

    <div class="step" id="step3">
        <h2>How much do you need for this?</h2>
        <input type="number" id="goalAmount" placeholder="0.00">
        <div class="btn-group">
            <button class="btn-back" onclick="prevStep(3)">Back</button>
            <button class="btn-next" onclick="nextStep(3)">Next</button>
        </div>
    </div>

    <div class="step" id="step4">
        <h2>In how many months?</h2>
        <input type="number" id="months" placeholder="e.g., 24">
        <div class="btn-group">
            <button class="btn-back" onclick="prevStep(4)">Back</button>
            <button class="btn-next" onclick="calculatePlan()">Generate Blueprint</button>
        </div>
    </div>

    <!-- Step 6: Results -->
    <div class="step" id="step5">
        <h2>Your Master Plan</h2>
        <div id="resultsContent"></div>
        <div class="btn-group">
            <button class="btn-back" onclick="resetForm()">Plan Another Goal</button>
        </div>
    </div>

</div>

<script>
    const beautifulMessages = [
        "Every sum saved is a seed planted for your future forest.",
        "Patience and discipline are the true architects of financial freedom.",
        "Your dreams are valid, and today you've mapped the path to reach them.",
        "Small, consistent steps move mountains over time.",
        "Wealth isn't just about money; it's about the freedom to live on your own terms.",
        "Time is your greatest asset. Starting today is your greatest victory."
    ];

    function nextStep(current) {
        const inputs = document.querySelectorAll('.step')[current].querySelectorAll('input');
        if (inputs[0] && inputs[0].value === "") {
            alert("Please enter a value before continuing.");
            return;
        }
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + (current + 1)).classList.add('active');
    }

    function prevStep(current) {
        document.getElementById('step' + current).classList.remove('active');
        document.getElementById('step' + (current - 1)).classList.add('active');
    }

    function resetForm() {
        document.getElementById('step5').classList.remove('active');
        document.getElementById('step0').classList.add('active');
        document.querySelectorAll('input').forEach(input => input.value = '');
    }

    function calculatePlan() {
        // Retrieve values and parse them
        let incomeValue = document.getElementById('income').value;
        let expensesValue = document.getElementById('expenses').value;
        let goalAmountValue = document.getElementById('goalAmount').value;
        let monthsValue = document.getElementById('months').value;

        // Use the currency symbol based on the user's input, default to $
        const currency = "₹"; // Changed default to generic or leave as numeric

        const income = parseFloat(incomeValue) || 0;
        const expenses = parseFloat(expensesValue) || 0;
        const goalName = document.getElementById('goalName').value || "Your Goal";
        const goalAmount = parseFloat(goalAmountValue) || 0;
        const months = parseInt(monthsValue) || 1;

        if (goalAmount <= 0 || months <= 0) {
            alert("Please enter valid goal numbers.");
            return;
        }

        nextStep(4);

        const capacity = income - expenses;
        const requiredMonthly = goalAmount / months;
        const score = (capacity / requiredMonthly) * 100;
        const isAchievable = score >= 100;
        
        const finalMonths = isAchievable ? months : Math.ceil(goalAmount / capacity);
        const finalMonthlySave = isAchievable ? requiredMonthly : capacity;
        const surplus = isAchievable ? (capacity - requiredMonthly) : 0;

        // Zero-Based Budgeting Splitting
        const personalSpending = surplus * 0.30; // 30% of leftover for fun
        const generalInvesting = surplus * 0.70; // 70% of leftover for wealth

        let htmlOutput = "";

        const randomMsg = beautifulMessages[Math.floor(Math.random() * beautifulMessages.length)];
        htmlOutput += `<div class="quote-box">"${randomMsg}"</div>`;

        if (capacity <= 0) {
            htmlOutput += `
                <div class="result-box warning">
                    <h3>Critical Analysis</h3>
                    <p>Your expenses match or exceed your income. You have zero available capacity.</p>
                    <p><strong>Next Step:</strong> Focus entirely on reducing fixed expenses or increasing income streams before tackling this goal.</p>
                </div>`;
            document.getElementById('resultsContent').innerHTML = htmlOutput;
            return;
        }

        let boxClass = isAchievable ? "result-box" : "result-box warning";
        htmlOutput += `<div class="${boxClass}">`;
        
        if (isAchievable) {
            htmlOutput += `<h3>Target: 100% Achievable</h3>
                           <p>You have the capacity to conquer this in <strong>${months} months</strong>.</p>`;
        } else {
            htmlOutput += `<h3>Target: ${score.toFixed(1)}% Achievable Initially</h3>
                           <p>To reach this safely without debt, your timeline shifts to <strong>${finalMonths} months</strong>.</p>`;
        }

        // --- Zero-Based Allocation ---
        htmlOutput += `<h4>The Monthly Blueprint (Every Penny Accounted For)</h4>
                       <ul>
                           <li><strong>Needs:</strong> ${expenses.toFixed(2)} to cover your fixed living expenses.</li>
                           <li><strong>The Goal:</strong> ${finalMonthlySave.toFixed(2)} locked away for ${goalName}.</li>`;
        
        if (surplus > 0) {
            htmlOutput += `<li><strong>Future Wealth:</strong> ${generalInvesting.toFixed(2)} extra to invest and grow your net worth.</li>
                           <li><strong>Guilt-Free Fun:</strong> ${personalSpending.toFixed(2)} to spend entirely on yourself!</li>`;
        } else {
            htmlOutput += `<li><strong>Reality Check:</strong> You currently have 0.00 left for extra personal spending. Every spare penny is fighting for your goal!</li>`;
        }
        htmlOutput += `</ul>
                       <div class="zero-based-summary">
                           Total Allocated: ${(expenses + finalMonthlySave + personalSpending + generalInvesting).toFixed(2)} / Total Income: ${income.toFixed(2)}
                       </div>`;

        // --- Smart Investment Recommendations WITH AMOUNTS ---
        htmlOutput += `<h4>Execution Strategy (Where to put the money)</h4><ul>`;
        
        if (finalMonths < 36) {
            htmlOutput += `<li><strong>For ${goalName}:</strong> Because your timeline is short (under 3 years), protect your capital. Open a <strong>Fixed Deposit (FD)</strong> or Recurring Deposit (RD) and deposit exactly <strong>${finalMonthlySave.toFixed(2)}</strong> into it every month.</li>`;
        } else {
            htmlOutput += `<li><strong>For ${goalName}:</strong> Because your timeline is long (3+ years), beat inflation. Start a Systematic Investment Plan (SIP) in a Conservative <strong>Mutual Fund</strong> for exactly <strong>${finalMonthlySave.toFixed(2)}</strong> every month.</li>`;
        }

        if (surplus > 0) {
            htmlOutput += `<li><strong>For Future Wealth:</strong> Take the extra <strong>${generalInvesting.toFixed(2)}</strong> we allocated for wealth building and automate a monthly SIP into an Equity Mutual Fund or Index Fund to grow your long-term money.</li>`;
        }
        
        htmlOutput += `<li><strong>Action Required:</strong> Always search the internet for today's live interest rates and historical mutual fund returns before deciding where to park your money!</li>`;
        htmlOutput += `</ul>`;

        // --- Yearly Milestones ---
        const totalYears = Math.floor(finalMonths / 12);
        const remainingMonths = finalMonths % 12;
        
        if (finalMonths > 12) {
            htmlOutput += `<h4>Yearly Progress Tracker</h4><ul>`;
            for (let i = 1; i <= totalYears; i++) {
                let savedSoFar = finalMonthlySave * 12 * i;
                htmlOutput += `<li><strong>End of Year ${i}:</strong> ${savedSoFar.toFixed(2)} saved</li>`;
            }
            if (remainingMonths > 0) {
                htmlOutput += `<li><strong>Year ${totalYears} + ${remainingMonths} months:</strong> Goal Reached!</li>`;
            }
            htmlOutput += `</ul>`;
        }

        htmlOutput += `</div>`;
        document.getElementById('resultsContent').innerHTML = htmlOutput;
    }
</script>

</body>
</html>
